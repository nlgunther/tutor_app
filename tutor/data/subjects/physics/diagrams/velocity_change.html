<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceleration: velocity changing</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;align-items:center}
h1{font-size:30px;margin:18px 16px 4px}
svg{width:min(96vw,900px);height:auto}
p{font-size:24px;margin:6px 16px;text-align:center}
.close{font-size:20px;color:#444;margin:14px 16px 24px;padding:8px 16px;border:2px solid #444;border-radius:8px}
text{font-family:system-ui,Segoe UI,sans-serif;font-size:24px;fill:#1a1a1a}
.big{font-size:28px;font-weight:bold}
</style></head><body>
<h1>Acceleration: velocity changing</h1>
<svg viewBox="0 0 800 470" role="img" aria-label="Three rows of dots with arrows: growing arrows, shrinking arrows, and arrows that turn">
<defs>
<marker id="red" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#c0392b"/></marker>
<marker id="grn" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#1e8449"/></marker>
<marker id="blu" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#1f4e9c"/></marker>
</defs>
<text x="20" y="88" text-anchor="start" class="big">Speeding up</text>
<circle cx="270" cy="80" r="9" fill="#1a1a1a"/>
<line x1="270" y1="80" x2="300" y2="80" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<circle cx="400" cy="80" r="9" fill="#1a1a1a"/>
<line x1="400" y1="80" x2="455" y2="80" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<circle cx="530" cy="80" r="9" fill="#1a1a1a"/>
<line x1="530" y1="80" x2="610" y2="80" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<circle cx="660" cy="80" r="9" fill="#1a1a1a"/>
<line x1="660" y1="80" x2="765" y2="80" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<text x="20" y="208" text-anchor="start" class="big">Slowing down</text>
<circle cx="270" cy="200" r="9" fill="#1a1a1a"/>
<line x1="270" y1="200" x2="375" y2="200" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<circle cx="400" cy="200" r="9" fill="#1a1a1a"/>
<line x1="400" y1="200" x2="480" y2="200" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<circle cx="530" cy="200" r="9" fill="#1a1a1a"/>
<line x1="530" y1="200" x2="585" y2="200" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<circle cx="660" cy="200" r="9" fill="#1a1a1a"/>
<line x1="660" y1="200" x2="690" y2="200" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<text x="20" y="328" text-anchor="start" class="big">Turning</text>
<circle cx="270" cy="320" r="9" fill="#1a1a1a"/>
<g transform="rotate(0 270 320)"><line x1="270" y1="320" x2="340" y2="320" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/></g>
<circle cx="400" cy="320" r="9" fill="#1a1a1a"/>
<g transform="rotate(-35 400 320)"><line x1="400" y1="320" x2="470" y2="320" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/></g>
<circle cx="530" cy="320" r="9" fill="#1a1a1a"/>
<g transform="rotate(-70 530 320)"><line x1="530" y1="320" x2="600" y2="320" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/></g>
<circle cx="660" cy="320" r="9" fill="#1a1a1a"/>
<g transform="rotate(-105 660 320)"><line x1="660" y1="320" x2="730" y2="320" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/></g>
<text x="400" y="440" text-anchor="middle">Each dot is one second. The red arrow is the velocity.</text>
</svg>
<p>Acceleration is any change in velocity: faster, slower, or a new direction.</p>
<p class="close">Done looking? Click the X in the corner to close this window, then go back to the chat.</p>
</body></html>
