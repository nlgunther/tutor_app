<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Third law: two skaters push off</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;align-items:center}
h1{font-size:30px;margin:18px 16px 4px}
svg{width:min(96vw,900px);height:auto}
p{font-size:24px;margin:6px 16px;text-align:center}
.close{font-size:20px;color:#444;margin:14px 16px 24px;padding:8px 16px;border:2px solid #444;border-radius:8px}
text{font-family:system-ui,Segoe UI,sans-serif;font-size:24px;fill:#1a1a1a}
.big{font-size:28px;font-weight:bold}
</style></head><body>
<h1>Third law: two skaters push off</h1>
<svg viewBox="0 0 800 410" role="img" aria-label="Two skaters back to back pushing apart with equal red arrows and different green acceleration arrows">
<defs>
<marker id="red" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#c0392b"/></marker>
<marker id="grn" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#1e8449"/></marker>
<marker id="blu" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#1f4e9c"/></marker>
</defs>
<circle cx="300" cy="110" r="22" fill="#f5cba7" stroke="#1a1a1a" stroke-width="3"/>
<rect x="272" y="136" width="56" height="86" rx="10" fill="#85c1e9" stroke="#1a1a1a" stroke-width="3"/>
<text x="300" y="188" text-anchor="middle" class="big">A</text>
<text x="300" y="250" text-anchor="middle">40 kg</text>
<line x1="260" y1="170" x2="150" y2="170" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<text x="205" y="140" text-anchor="middle">120 N</text>
<line x1="300" y1="295" x2="150" y2="295" stroke="#1e8449" stroke-width="10" marker-end="url(#grn)"/>
<text x="300" y="335" text-anchor="middle">3 m/s² left</text>
<circle cx="500" cy="110" r="22" fill="#f5cba7" stroke="#1a1a1a" stroke-width="3"/>
<rect x="472" y="136" width="56" height="86" rx="10" fill="#85c1e9" stroke="#1a1a1a" stroke-width="3"/>
<text x="500" y="188" text-anchor="middle" class="big">B</text>
<text x="500" y="250" text-anchor="middle">60 kg</text>
<line x1="540" y1="170" x2="650" y2="170" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<text x="595" y="140" text-anchor="middle">120 N</text>
<line x1="500" y1="295" x2="600" y2="295" stroke="#1e8449" stroke-width="10" marker-end="url(#grn)"/>
<text x="500" y="335" text-anchor="middle">2 m/s² right</text>
<text x="400" y="385" text-anchor="middle" class="big">Equal and opposite pushes, on different skaters</text>
</svg>
<p>The pair of forces is equal. The accelerations differ because the masses differ.</p>
<p class="close">Done looking? Click the X in the corner to close this window, then go back to the chat.</p>
</body></html>
