<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second law: the same push on two carts</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;align-items:center}
h1{font-size:30px;margin:18px 16px 4px}
svg{width:min(96vw,900px);height:auto}
p{font-size:24px;margin:6px 16px;text-align:center}
.close{font-size:20px;color:#444;margin:14px 16px 24px;padding:8px 16px;border:2px solid #444;border-radius:8px}
text{font-family:system-ui,Segoe UI,sans-serif;font-size:24px;fill:#1a1a1a}
.big{font-size:28px;font-weight:bold}
</style></head><body>
<h1>Second law: the same push on two carts</h1>
<svg viewBox="0 0 800 410" role="img" aria-label="A 4 kilogram cart and a 6 kilogram cart each pushed by 12 newtons, with a longer green arrow for the lighter cart">
<defs>
<marker id="red" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#c0392b"/></marker>
<marker id="grn" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#1e8449"/></marker>
<marker id="blu" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><path d="M0,0 L24,10 L0,20 z" fill="#1f4e9c"/></marker>
</defs>
<rect x="250" y="50" width="110" height="80" fill="#f5b041" stroke="#1a1a1a" stroke-width="3"/>
<text x="305.0" y="98" text-anchor="middle">4 kg</text>
<line x1="130" y1="90" x2="245" y2="90" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<text x="40" y="78" text-anchor="start">12 N push</text>
<line x1="380" y1="90" x2="530" y2="90" stroke="#1e8449" stroke-width="7" marker-end="url(#grn)"/>
<text x="380" y="142" text-anchor="start">speeds up 3 m/s every second</text>
<rect x="250" y="200" width="150" height="80" fill="#f5b041" stroke="#1a1a1a" stroke-width="3"/>
<text x="325.0" y="248" text-anchor="middle">6 kg</text>
<line x1="130" y1="240" x2="245" y2="240" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
<text x="40" y="228" text-anchor="start">12 N push</text>
<line x1="420" y1="240" x2="520" y2="240" stroke="#1e8449" stroke-width="7" marker-end="url(#grn)"/>
<text x="420" y="292" text-anchor="start">speeds up 2 m/s every second</text>
<text x="400" y="385" text-anchor="middle" class="big">a = F ÷ m: 12 ÷ 4 = 3, and 12 ÷ 6 = 2</text>
</svg>
<p>Same push, more mass, smaller acceleration.</p>
<p class="close">Done looking? Click the X in the corner to close this window, then go back to the chat.</p>
</body></html>
